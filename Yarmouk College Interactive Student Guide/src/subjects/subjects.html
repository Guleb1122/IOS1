<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المواد الدراسية - كلية اليرموك</title>
  
  <!-- الخط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="subjects-style.css">
  
  <!-- GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- شريط التنقل العلوي -->
  <header class="top-navbar">
    <div class="nav-container">
      <a href="javascript:history.back()" class="back-btn" title="رجوع">
        <i class="fa-solid fa-chevron-right"></i>
      </a>
      
      <h1 class="page-title">المواد الدراسية</h1>

      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" title="تبديل الوضع">
          <i class="fa-solid fa-sun sun-icon"></i>
          <i class="fa-solid fa-moon moon-icon"></i>
        </button>

        <button class="menu-btn" id="menuToggle" title="القائمة">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- القائمة الجانبية للهامبرغر -->
  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="sidebar-menu" id="sidebarMenu">
    <div class="sidebar-header">
      <h3>أقسام الكلية</h3>
      <button class="close-sidebar-btn" id="closeSidebarBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="sidebar-departments-list">
      <li>
        <a href="/src/department/department.html" class="sidebar-dept-item">
          <div class="dept-sm-icon"><i class="fa-solid fa-desktop"></i></div>
          <span> هندسة الحاسوب</span>
        </a>
      </li>
      <li>
        <a href="/src/department/department.html" class="sidebar-dept-item">
          <div class="dept-sm-icon"><i class="fa-solid fa-user-shield"></i></div>
          <span>الأمن السيبراني</span>
        </a>
      </li>
      <li>
        <a href="subjects.html" class="sidebar-dept-item active">
          <div class="dept-sm-icon"><i class="fa-solid fa-book-open"></i></div>
          <span>المواد الدراسية</span>
        </a>
      </li>
    </ul>
  </aside>

  <!-- الحاوية الرئيسية -->
  <main class="subjects-container">
    
    <!-- قائمة اختيار القسم -->
    <div class="filters-section">
      <div class="filter-group">
        <label for="deptSelect">اختر القسم</label>
        <div class="select-wrapper">
          <select id="deptSelect">
            <option value="cs">قسم علوم الحاسوب</option>
            <option value="cyber">قسم الأمن السيبراني</option>
          </select>
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </div>
    </div>

    <!-- أزرار اختيار المراحل الدراسية -->
    <div class="stages-tabs-container">
      <button class="stage-tab-btn active" data-stage="1">المرحلة الأولى</button>
      <button class="stage-tab-btn" data-stage="2">المرحلة الثانية</button>
      <button class="stage-tab-btn" data-stage="3">المرحلة الثالثة</button>
      <button class="stage-tab-btn" data-stage="4">المرحلة الرابعة</button>
    </div>

    <!-- صندوق عرض مواد المرحلة المحددة -->
    <div class="stage-content-card" id="stageContentCard">
      <div class="stage-card-header">
        <h3 id="stageHeaderTitle">مواد المرحلة الأولى</h3>
        <a href="#" class="pdf-download-btn" id="pdfDownloadBtn" target="_blank">
          <i class="fa-solid fa-file-pdf"></i>
          <span>تحميل ملازم المرحلة (PDF)</span>
        </a>
      </div>

      <!-- قائمة المواد -->
      <div class="subjects-list" id="subjectsList"></div>
    </div>

  </main>

  <script src="subjects-script.js"></script>
</body>
</html>
